# Draft generated by `aethyme init` from this repo's manifests.
# REVIEW EVERY GATE: commands, triggers, and cost tiers are guesses.
# Rules: commands run with cwd = the worktree under test (bare —
# no venv/node_modules); gate outputs must be gitignored.
# Set this to true only after reviewing every command and trigger.
reviewed = false

[[gate]]
name = "js-lint"
command = "npm run lint --silent"
cost = 1
timeout_seconds = 300
triggers = ["**/*.js", "**/*.jsx", "**/*.ts", "**/*.tsx", "package.json"]

[[gate]]
name = "js-test"
command = "npm test --silent"
cost = 2
timeout_seconds = 900
triggers = ["**/*.js", "**/*.jsx", "**/*.ts", "**/*.tsx", "package.json"]
